<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logo 辅助线</title><link rel="stylesheet" href="css/panel.css"></head>
<body>
<header><div><span class="eyebrow">LOGO GUIDES</span><h1>Logo 辅助线</h1></div><span class="version">M8 · 开发中</span></header>
<nav class="actions"><button id="generate" class="primary">生成</button><button id="refresh">刷新来源</button><button id="dump">导出 dump</button><button id="connect" title="切换 Illustrator 文档后重新连接">连接当前文档</button></nav>
<output id="status" role="status" aria-live="polite">正在连接 Illustrator…</output>
<main>
<section><h2>基准单位 <i>a</i></h2><div class="row"><label>a / pt<input id="baseValue" type="number" min="0.000001" step="any"></label><label class="check"><input id="baseLock" type="checkbox">锁定 a</label><button id="setBase">应用</button></div><div class="row"><button id="autoBase">自动选择</button><button id="measure">读取选中宽高 / 候选</button></div><div id="candidates" class="chips"></div><div id="measurements" class="chips"></div></section>
<section><h2>参数</h2><div id="parameters" class="grid"></div><label class="slider">圆拟合容差 <output id="fitValue"></output><input id="circleFit" type="range" min="0.005" max="0.06" step="0.0001"></label><div id="checks" class="grid checks"></div></section>
<details open><summary>生成内容</summary><div id="features" class="grid checks"></div></details>
<section><div class="section-title"><h2>特征管理</h2><label class="check"><input id="curated" type="checkbox">精选模式</label></div><label>视图<select id="view"><option value="category">按类别</option><option value="severity">规范检查 · 按偏差</option></select></label><div id="featureList" class="feature-list"><p class="muted">生成或刷新后显示特征。</p></div></section>
<section><h2>AI 建议</h2><p class="muted">仅发送数值摘要。先检查建议，再点击应用；来源图形保持原样。请求失败时回退精选模式。</p><label>用途<select id="aiGoal"><option value="presentation">展示 · 精选辅助线</option><option value="check">检查 · 规范与偏差</option></select></label><div class="row"><button id="aiRequest">请求 AI 建议</button><button id="aiApply">应用建议</button></div><pre id="aiAdvice" class="ai-text" aria-live="polite">尚无 AI 建议。</pre><details><summary>本次数值摘要</summary><pre id="aiSummary" class="ai-text"></pre></details><details id="aiSettings"><summary>AI 连接设置</summary><p class="muted">API key 以明文保存在本机用户目录 LogoGuides/ai.json，不写入 Illustrator 文档。请勿分享该文件。</p><div class="stack"><label>提供商<select id="aiProvider"><option value="openai">OpenAI 兼容接口</option><option value="anthropic">Anthropic</option></select></label><label>baseUrl<input id="aiBaseUrl" type="url" placeholder="https://服务地址/v1" autocomplete="off"></label><label>模型名<input id="aiModel" type="text" autocomplete="off"></label><label>API key<input id="aiKey" type="password" autocomplete="off" spellcheck="false"></label><button id="aiSave">保存本机配置</button><output id="aiConfigStatus" aria-live="polite"></output></div></details></section>
<details><summary>清除</summary><p class="muted">保留来源对象；最后一项同时移除文档数据与来源标签。</p><div class="stack"><button data-clear="auto">仅自动辅助线</button><button data-clear="all">全部辅助线（含手动）</button><button data-clear="data">全部 + 数据和来源标签</button></div></details>
<pre id="warnings" aria-live="polite"></pre>
</main><footer>参数修改后刷新现有来源；首次生成使用当前选区。</footer>
<script src="vendor/CSInterface.js"></script><script src="js/core.js"></script><script src="js/model.js"></script><script src="js/ai.js"></script><script src="js/controller.js"></script><script src="js/app.js"></script>
</body></html>
